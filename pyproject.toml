[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-jit"
version = "0.6.0"
description = "Context-aware LoRA adapter routing and paging for local IDE code generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anand B" }]
keywords = ["lora", "peft", "routing", "vscode", "local-llm", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]
runtime = [
  "torch>=2.4.0",
  "transformers>=4.44.0",
  "peft>=0.12.0",
  "accelerate>=0.34.0",
  "safetensors>=0.4.4",
]

[project.urls]
Homepage = "https://github.com/Anandb71/LoRA-jit"
Documentation = "https://github.com/Anandb71/LoRA-jit/tree/main/docs"
Repository = "https://github.com/Anandb71/LoRA-jit"
Issues = "https://github.com/Anandb71/LoRA-jit/issues"
Changelog = "https://github.com/Anandb71/LoRA-jit/blob/main/CHANGELOG.md"

[project.scripts]
lora-jit-daemon = "backend.cli:daemon_main"
lora-jit-benchmark = "backend.cli:benchmark_main"
lora-jit-compile = "backend.cli:compile_trace_main"
lora-jit-annotate = "backend.cli:annotate_main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
